{% extends "common/base.html" %}
{% block title %}Delete Profile{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger shadow-sm">
                <div class="card-body">
                    <h1 class="h4 text-danger mb-3">Delete profile</h1>
                    <p class="mb-3">
                        This will permanently delete your account and you will be logged out.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button class="btn btn-danger" type="submit">Delete my account</button>
                            <a class="btn btn-outline-secondary" href="{% url 'profile-detail' %}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
