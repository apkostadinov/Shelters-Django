{% extends "common/base.html" %}

{% block title %}Edit {{ shelter.name }} Dashboard{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h1 class="h3 mb-3">Edit dashboard</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" href="{% url 'shelter-dashboard' shelter.id %}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
