{% extends "common/base.html" %}
{% block title %}Delete Dashboard{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger shadow-sm">
                <div class="card-body">
                    <h1 class="h4 text-danger mb-3">Delete dashboard</h1>
                    <p class="mb-3">
                        Are you sure you want to delete the dashboard for <strong>{{ shelter.name }}</strong>?
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2">
                            <button class="btn btn-danger" type="submit">Delete dashboard</button>
                            <a class="btn btn-outline-secondary"
                               href="{% url 'shelter-dashboard' shelter.id %}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
